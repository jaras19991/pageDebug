<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>PDS fixture: DOM 10 000 elements</title>
</head>
<body>
  <!-- E3-TEST5 (AC-5.2): 10 000 elements with id, class, data-* and role build a structure well over 300 000 characters
       (~80 per element), so dom.structure is cut to limits.html with truncated.html and a note. -->
  <h1>Strona testowa: 10 000 elementów</h1>
  <div id="list" role="list"></div>
  <script>
    (() => {
      const parts = [];
      for (let i = 0; i < 9998; i++) {
        parts.push(`<div id="row-${i}" class="row row-${i % 10} item" data-row="${i}" role="listitem">Wiersz ${i}</div>`);
      }
      document.getElementById('list').innerHTML = parts.join('');
      window.__elements = document.getElementsByTagName('*').length;
    })();
  </script>
</body>
</html>
