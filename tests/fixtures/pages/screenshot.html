<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>PDS fixture: screenshot</title>
  <style>
    /* One flat colour on the whole viewport: the four corners of a screenshot must have it (AC-6.2, no popup in the image). */
    html, body { margin: 0; height: 100%; background: rgb(0, 128, 255); }
    #label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 24px Arial, sans-serif; color: #fff; }
  </style>
</head>
<body>
  <div id="label">Strona testowa: zrzut ekranu</div>
</body>
</html>
