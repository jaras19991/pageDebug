<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Page Debug Snapshot — podgląd paczki</title>
<style>
:root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
body { margin: 0; }
[hidden] { display: none !important; }
header { padding: 12px 16px; border-bottom: 1px solid #8884; }
h1 { margin: 0; font-size: 18px; }
nav[role="tablist"] { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #8884; }
nav[role="tablist"] button { font: inherit; padding: 4px 10px; border: 1px solid #8886; border-radius: 4px; background: none; color: inherit; cursor: pointer; }
nav[role="tablist"] button[aria-selected="true"] { background: #8883; font-weight: 600; }
main { padding: 16px; }
.drop { margin-top: 12px; padding: 32px; border: 2px dashed #8888; border-radius: 8px; text-align: center; }
.drop.loaded { padding: 8px 12px; text-align: left; }
.drop.dragging { border-color: #36c; background: #36c2; }
.drop p { margin: 4px 0; }
.load-error, .banner { margin: 8px 0; padding: 6px 10px; border-radius: 4px; background: #c332; }
.banner { background: #c902; }
.load-status { color: #888; }
.package-info h2 { margin: 12px 0 4px; font-size: 16px; word-break: break-all; }
.package-info p, .package-info ul { margin: 4px 0; }
pre, .text-block { white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, monospace; }
.truncated { color: #b60; }
table { border-collapse: collapse; }
th, td { padding: 2px 8px; border-bottom: 1px solid #8883; text-align: left; vertical-align: top; }
img { max-width: 100%; border: 1px solid #8884; }
</style>
</head>
<body>
<header>
<h1>Podgląd paczki diagnostycznej</h1>
<div id="loader"></div>
<div id="package-info"></div>
</header>
<nav role="tablist" aria-label="Zakładki" hidden>
<button type="button" role="tab" data-tab="summary" aria-selected="true">Podsumowanie</button>
<button type="button" role="tab" data-tab="steps" aria-selected="false">Kroki</button>
<button type="button" role="tab" data-tab="errors" aria-selected="false">Błędy</button>
<button type="button" role="tab" data-tab="network" aria-selected="false">Sieć</button>
<button type="button" role="tab" data-tab="console" aria-selected="false">Konsola</button>
<button type="button" role="tab" data-tab="vitals" aria-selected="false">CWV</button>
<button type="button" role="tab" data-tab="dom" aria-selected="false">DOM</button>
<button type="button" role="tab" data-tab="storage" aria-selected="false">Storage</button>
</nav>
<main id="app"></main>
<script>{{SCRIPT}}</script>
</body>
</html>
