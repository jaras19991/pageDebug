<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Page Debug Snapshot</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 280px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.4;
      color: #444;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .secondary {
      background: #f3f3f3;
      color: #111;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.4;
      min-height: 18px;
      color: #0a7f39;
      word-break: break-word;
    }

    #status.error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <h1>Page Debug Snapshot</h1>
  <p>Uruchom snapshot debugowy dla aktualnej karty.</p>

  <div class="actions">
    <button id="runSnapshot">Debug snapshot</button>
  </div>

  <div id="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
